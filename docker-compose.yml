# Kasper + Cloudflare quick tunnel on the Synology NAS - TEST setup for the test store.
# Container Manager → Project → Create → choose this folder. Step by step: docs/synology-nl.md
#
# Nothing is opened in the router: Kasper has no ports on the network.
# The only way in is the Cloudflare quick tunnel: a random https://….trycloudflare.com address,
# shown in the log of the container "casper-tunnel". It changes after every restart.
# For going live this becomes a fixed tunnel with an own address (like the invoice app).

services:
  casper:
    # The image GitHub builds after a push to the branch release (NAS Beheer -> Paneel -> Updates).
    # build: . is only used when you build here yourself (docker compose up -d --build).
    image: ghcr.io/stolemynikes/casper:release
    build: .
    container_name: casper
    restart: unless-stopped
    # Test: Kasper runs as the container's own user "node" (no admin rights, and it can only reach
    # what is listed under "volumes", which is nothing). For going live: an own DSM user, like the invoice app.
    env_file: .env
    environment:
      # Paths inside the container
      PORT: 8090
      # Test: contact requests stay inside the container (gone after a rebuild). For going live: e-mail to info@.
      CONTACT_SAVE_DIR: /tmp/contact-requests
      TZ: Europe/Amsterdam
      # Only reachable through the tunnel: trust Cloudflare's visitor address, and no public test page
      TRUST_CLOUDFLARE: "true"
      SHOW_TEST_PAGE: "false"
      # Settings from the NAS admin panel and the logbook: on the volume below, so they survive a rebuild
      SETTINGS_PATH: /app/data/settings.json
    volumes:
      - kasper-data:/app/data
    networks:
      - intern
      # Shared with the NAS admin panel (create it once: Container Manager -> Network -> Add -> nas-apps)
      - nas-apps

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: casper-tunnel
    restart: unless-stopped
    # Quick tunnel: no Cloudflare account needed, the address is in this container's log.
    # The metrics port lets Kasper read that address (only inside this Docker network), see shopify/widgetAddress.js
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://casper:8090
    depends_on:
      - casper
    networks:
      - intern

networks:
  intern:
  nas-apps:
    external: true
    name: nas-apps

volumes:
  kasper-data:
